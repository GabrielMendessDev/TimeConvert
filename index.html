<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeConvert</title>
  <meta name="description" content="Conversor de tempo entre minutos:segundos e segundos. Facil e rapido!">
  <meta name="theme-color" content="#05060b">
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Camadas de fundo: gradientes estaticos, sem filtros nem animacao -->
  <div class="bg-fx" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-mark">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#22d3ee"/><stop offset="50%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#a855f7"/></linearGradient></defs>
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </span>
        <div class="logo-text">
          <h1>TimeConvert</h1>
          <span class="logo-sub">timestamp&nbsp;/&nbsp;delay engine</span>
        </div>
      </div>
      <div class="header-meta">
        <span class="status-pill"><i class="led"></i>online</span>
        <span class="badge">v2.0</span>
      </div>
    </header>

    <!-- Conversor principal -->
    <main class="converter-card">
      <!-- Seletor de modo -->
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="ms-to-s">min &rarr; seg</button>
        <button class="mode-btn" data-mode="s-to-ms">seg &rarr; min</button>
      </div>

      <!-- Input -->
      <div class="input-group">
        <label class="input-label" id="inputLabel">Minutos:Segundos</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="inputValue"
            class="input-field"
            placeholder="Ex: 3:45"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn-clear" id="btnClear" title="Limpar (Esc)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <span class="input-hint" id="inputHint">Digite no formato minutos:segundos</span>
      </div>

      <!-- Resultado -->
      <div class="result-area" id="resultArea">
        <span class="hud-corner tl" aria-hidden="true"></span>
        <span class="hud-corner tr" aria-hidden="true"></span>
        <span class="hud-corner bl" aria-hidden="true"></span>
        <span class="hud-corner br" aria-hidden="true"></span>

        <span class="result-label">Resultado</span>
        <div class="result-value" id="resultValue">&mdash;</div>
        <span class="result-unit" id="resultUnit">segundos</span>
        <button class="btn-copy" id="btnCopy" title="Copiar resultado (Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copyText">Copiar</span>
        </button>
      </div>

      <!-- Atalhos -->
      <div class="shortcuts">
        <span><kbd>Enter</kbd> copiar</span>
        <span><kbd>Esc</kbd> limpar</span>
      </div>
    </main>

    <!-- Historico -->
    <section class="history-card">
      <div class="history-header">
        <h2>Historico</h2>
        <button class="btn-clear-history" id="btnClearHistory">Limpar tudo</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-empty">Nenhuma conversao ainda</li>
      </ul>
    </section>

    <!-- Creditos -->
    <footer class="footer">
      <span class="footer-tag">desenvolvido por</span>
      <p class="footer-name">Gabriel Mendes</p>
      <nav class="socials" aria-label="Redes sociais">
        <a class="social" href="https://www.instagram.com/gabrielmenndess/" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
        <a class="social" href="https://www.linkedin.com/in/gabriel-mendes-bb5571264/" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a class="social" href="https://github.com/GabrielMendessDev" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 4.94-2.22 4.94-6.15a4.67 4.67 0 0 0-1.3-3.22 4.36 4.36 0 0 0-.08-3.23s-1.28-.38-4.2 1.6a12.6 12.6 0 0 0-6.6 0C6.9 1.34 5.62 1.72 5.62 1.72a4.36 4.36 0 0 0-.08 3.23A4.67 4.67 0 0 0 4.24 8.2c0 3.9 1.8 5.77 4.94 6.15a3.37 3.37 0 0 0-.94 2.58V21"/></svg>
        </a>
      </nav>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
