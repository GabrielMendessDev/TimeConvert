<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeConvert</title>
  <meta name="description" content="Conversor de tempo entre minutos:segundos e segundos. Fácil e rapido!">
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#a855f7"/></linearGradient></defs>
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <h1>TimeConvert</h1>
      </div>
      <span class="badge">v1.0</span>
    </header>

    <!-- Conversor principal -->
    <main class="converter-card">
      <!-- Seletor de modo -->
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="ms-to-s">min → seg</button>
        <button class="mode-btn" data-mode="s-to-ms">seg → min</button>
      </div>

      <!-- Input -->
      <div class="input-group">
        <label class="input-label" id="inputLabel">Minutos:Segundos</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="inputValue"
            class="input-field"
            placeholder="Ex: 3:45"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn-clear" id="btnClear" title="Limpar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <span class="input-hint" id="inputHint">Digite no formato minutos:segundos</span>
      </div>

      <!-- Resultado -->
      <div class="result-area" id="resultArea">
        <span class="result-label">Resultado</span>
        <div class="result-value" id="resultValue">&mdash;</div>
        <span class="result-unit" id="resultUnit">segundos</span>
        <button class="btn-copy" id="btnCopy" title="Copiar resultado">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copyText">Copiar</span>
        </button>
      </div>

    </main>

    <!-- Historico -->
    <section class="history-card">
      <div class="history-header">
        <h2>Historico</h2>
        <button class="btn-clear-history" id="btnClearHistory">Limpar tudo</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-empty">Nenhuma conversao ainda</li>
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
